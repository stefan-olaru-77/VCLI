[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vcli"
version = "0.1.0"
description = "A VSCode-like editor for the Linux terminal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "vcli contributors" }]
keywords = ["editor", "terminal", "tui", "vscode", "prompt-toolkit"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Text Editors",
]
dependencies = [
    "prompt_toolkit>=3.0.43",
    "Pygments>=2.15",
]

[project.optional-dependencies]
system-clipboard = ["pyperclip>=1.8"]
dev = ["pytest>=8"]

[project.scripts]
vcli = "vcli.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
